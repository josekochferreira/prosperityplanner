name: Buxfer sync

on:
  schedule:
    - cron: "0 0 * * 0" # Sundays 00:00 UTC
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (blank = last 90 days; use an early date to backfill)"
        required: false

concurrency:
  group: buxfer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync Buxfer -> Supabase
        env:
          BUXFER_EMAIL: ${{ secrets.BUXFER_EMAIL }}
          BUXFER_PASSWORD: ${{ secrets.BUXFER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          START: ${{ inputs.start }}
        run: python sync_buxfer.py ${START:+--start "$START"}
